name: Deploy to production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias frontend
        run: |
          cd autotrack-frontend
          npm install

      - name: Build frontend
        run: |
          cd autotrack-frontend
          VITE_API_URL=/autotrack-api npx vite build --base=/AMBARC/

      - name: SCP — copiar dist al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "autotrack-frontend/dist/*"
          target: "/var/www/html/autotrack/autotrack-frontend/dist/"
          strip_components: 2

      - name: SSH — actualizar API y reiniciar servicio
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            git config --global --add safe.directory /var/www/html/autotrack
            cd /var/www/html/autotrack
            git fetch origin master
            git reset --hard origin/master
            cd autotrack-backend
            npm install --omit=dev
            systemctl restart autotrack
