name: Desplegar a producción

# Se dispara solo con un push a master, o a mano desde la pestaña Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verificar:
    name: Verificar que compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Antes que nada: incoherencias entre archivos que compilan por separado
      # pero rompen la aplicación juntos (un rol sin pantalla, permisos que
      # difieren entre backend y frontend, columnas fuera del esquema).
      - name: Comprobar coherencia
        run: node scripts/verificar-coherencia.mjs

      - name: Comprobar sintaxis del backend
        run: |
          cd autotrack-backend
          for f in $(find src db -name '*.js'); do node --check "$f"; done

      - name: Compilar el frontend
        run: |
          cd autotrack-frontend
          npm install
          VITE_API_URL=/api npx vite build --base=/

  desplegar:
    name: Desplegar en el servidor
    needs: verificar
    runs-on: ubuntu-latest
    # Sin las credenciales del servidor el despliegue se salta en vez de
    # fallar: así un push sigue verificando que el proyecto compila aunque
    # todavía no haya servidor configurado.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Actualizar el servidor por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            sudo bash /var/www/mesa-servicio/scripts/deploy.sh
